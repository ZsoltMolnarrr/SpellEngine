// Dev-only ecosystem runtime for the SpellEngine workspace — applied by build.gradle ONLY when at least
// one group flag is enabled in the gitignored `workspace.properties` (template: workspace.properties.example):
//   rpg_series_classes      Archers, Wizards, Paladins, Rogues
//   rpg_series_gear         Arsenal, Armory
//   rpg_series_accessories  Jewelry, Relics
//   rpg_series_skills       SkillTree (+ Pufferfish Skills)
// Shared libraries the groups depend on (ArmorModelAPI, Runes, StructurePoolAPI, BundleAPI) load with any group.
// CI and other developers never evaluate this file.
//
// 26.1+: the game is unobfuscated, the published platform jar is the shaded main artifact (no `dev-shadow`
// classifier any more) and goes straight on the runtime classpath. See LESSONS_1.21.11_TO_26.1 §1.
//
// After publishing a content mod to mavenLocal, bump its pin here (and in the other loader's copy).
// NOTE: NeoForge variant mirrors the Fabric list; server boot verified 2026-08-26, client not yet.
def flags = rootProject.ext.rpgSeriesWorkspace

repositories {
    if (flags.rpg_series_skills) {
        maven { url = 'https://maven.puffish.net' } // Pufferfish Skills (SkillTree's hard dependency)
    }
    mavenLocal()
}

dependencies {
    // Shared libraries
    localRuntime("net.rpg_foundation:armor_model_api-neoforge:1.1.0.001+26.2") { transitive = false }
    localRuntime("net.rpg_series:runes-neoforge:1.3.2.001+26.2") { transitive = false }
    localRuntime("net.rpg_foundation:structure_pool_api-neoforge:1.3.0.001+26.2") { transitive = false }
    localRuntime("com.github.TheRedBrain:bundle-api-neoforge:1.1.1.001+26.2") { transitive = false }
    localRuntime("net.critical_strike:critical_strike-neoforge:1.0.5.007+26.2") { transitive = false } // used by SkillTree/Jewelry configs (critical_strike:chance)

    if (flags.rpg_series_classes) {
    localRuntime("net.rpg_series:archers-neoforge:3.1.2.009+26.2") { transitive = false }
    localRuntime("net.rpg_series:wizards-neoforge:3.1.2.008+26.2") { transitive = false }
    localRuntime("net.rpg_series:paladins-neoforge:3.1.2.010+26.2") { transitive = false }
    localRuntime("net.rpg_series:rogues-neoforge:3.1.2.008+26.2") { transitive = false }
    }
    if (flags.rpg_series_gear) {
    // TODO 26.2: not yet ported
    // localRuntime("net.arsenal:arsenal-neoforge:1.5.1.006+26.1.2") { transitive = false }
    // localRuntime("net.rpg_series:armory-neoforge:1.5.2.008+26.1.2") { transitive = false }
    }
    if (flags.rpg_series_accessories) {
    // TODO 26.2: not yet ported
    // localRuntime("net.rpg_series:jewelry-neoforge:2.4.1.008+26.1.2") { transitive = false }
    // localRuntime("net.rpg_series:relics-neoforge:1.4.1.007+26.1.2") { transitive = false }
    }
    if (flags.rpg_series_skills) {
    // TODO 26.2: not yet ported
    // localRuntime("net.rpg_series:skill_tree-neoforge:1.6.1.006+26.1.2") { transitive = false }
        localRuntime("net.puffish:skillsmod:0.18.3+26.2:neoforge")
    }
}
