# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Game
minecraft_version=26.3
# Game versions this build is released for: colon separated, oldest first; the first one is the manifest minimum.
#   single: minecraft_compat_versions=26.3     multiple: minecraft_compat_versions=26.3:26.3.1
minecraft_compat_versions=26.3

# Loader
enabled_platforms = fabric,neoforge
fabric_loader_version=0.19.5
neoforge_version = 26.3.0.3-beta

# Mod
maven_group=net.spell_engine
archives_name=spell_engine
mod_version=1.10.7.007

# Dependencies
fabric_api_version=0.160.6+26.3
# TODO 26.3: TinyConfig has no 26.3 build (Modrinth checked 2026-09-19); 4.0.1 is proven to load on 26.3 (SpellPower, Critical Strike).
tiny_config_version=4.0.1
cloth_config_version=26.3.158
player_anim_version=1.2.7+mc.26.3
# TODO 26.3: RPG Series upstreams come from mavenLocal (no 26.3 Modrinth releases yet) — 4-part dev versions.
# Flip the `maven.modrinth:*` lines in the three build.gradle files back on once released.
spell_power_version=1.6.2.001+26.3
ranged_weapon_api_version=4.0.0.001+26.3

critical_strike_version=1.0.6.001+26.3
# Critical Strike compat is compiled only when true
enable_critical_strike=true

# Compatibility
# REI (Roughly Enough Items) — recipe-viewer integration for the Spell Binding Table.
# Compile-only in `common`; never bundled, not a required dependency. (EMI has no builds past 1.21.1.)
# TODO 26.3: REI has NO 26.3 build (maven.shedaniel.me + Modrinth checked 2026-09-19; latest is 26.2.821).
# Gated off: when false, `net/spell_engine/compat/rei/` (common) and `net/spell_engine/neoforge/compat/rei/`
# (neoforge) are excluded from compilation and the API / dev-runtime deps are not declared. To restore once
# REI ships for this game version: set `enable_rei=true`, move `rei_version` to the 26.3 build, and re-add
# the two entrypoints to fabric.mod.json:
#     "rei_common": [ "net.spell_engine.compat.rei.SpellEngineReiCommonPlugin" ],
#     "rei_client": [ "net.spell_engine.compat.rei.SpellEngineReiClientPlugin" ]
enable_rei=false
rei_version=26.2.820
bundle_api_version=3.0.0.001+26.3
better_combat_version=3.2.2+26.3
combat_roll_version=3.0.1+26.3
# TODO 26.3: Shoulder Surfing has no 26.3 build (Modrinth checked 2026-09-19); compile-only API, last build kept.
shoulder_surfing_version=26.2-5.0.11
iris_version=1.11.6+26.3
# TODO 26.3: Iris has no NeoForge build for 26.3 (Fabric only). The NeoForge module compiles against the
# loader-agnostic `net.irisshaders.iris.api.v0` package, unchanged, so it keeps the last NeoForge jar until
# one exists; then fold this back into iris_version.
iris_neoforge_version=1.11.2+26.2
# TODO 26.3: FTB Teams/Library keep their 26.1.2 pins (compile-only compat, API unchanged).
ftb_teams_version=26.1.2.4
ftb_library_version=26.1.2.6

# Fabric only
# Trinkets Updated 4.x (mod id `trinkets_updated`, API package eu.pb4.trinkets.api) no longer uses Cardinal Components;
# it nests yumi-mc-foundation (dev.yumi.mc.core:yumi-mc-foundation) instead.
trinkets_version=4.2.0+26.3
mod_menu_version=21.0.0-beta.1
lamb_dynamic_lights_version=4.13.0+26.3

# NeoForge only
# Curios accessory-slot integration. The flag stays as the kill switch for game-version hops where Curios has no
# build yet (as between 2026-09-19 and 2026-09-22, when the 26.2 jar could not compile against NeoForge 26.3):
# when false, `neoforge/.../compat/curios/**` is excluded from compilation, the dependency is not declared, and
# `NeoForgeCompatFeatures.initSlotCompat()` finds no Curios bridge (it resolves the class reflectively).
enable_curios=true
curios_version=17.0.0-beta+26.3
