# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Game
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.1
minecraft_compat_version=1.20.1

# Loader
enabled_platforms = fabric,forge
fabric_loader_version=0.19.5
forge_version=1.20.1-47.4.22

# Mod
maven_group=net.spell_engine
archives_name=spell_engine
mod_version = 1.10.5

# Dependencies
fabric_api_version=0.92.12+1.20.1
# Modrinth maven coordinates: maven.modrinth:tiny-config:<version>-<platform>
tiny_config_version=3.1.0+1.20.1
cloth_config_version=11.1.106
# PlayerAnimator 1.x (mod id `player-animator`); maven.kosmx.dev ships both -fabric and -forge
player_anim_version=1.0.2+1.19.4
# Modrinth maven coordinates: maven.modrinth:spell-power:<version>-<platform>
spell_power_version=1.6.0+1.20.1
# Modrinth maven coordinates: maven.modrinth:ranged-weapon-api:<version>-<platform> (2.x line on 1.20.1, Fabric + Forge).
# Compile-only on every module: RangedWeaponAPI stays an optional runtime dependency (see RangedWeapons / ExternalSpellSchools).
ranged_weapon_api_version=2.3.4+1.20.1
# Modrinth maven coordinates: maven.modrinth:critical-strike:<version>-<platform>
critical_strike_version=1.0.4+1.20.1
# Forge 47 does not bundle MixinExtras (Fabric Loader does); the forge module jar-in-jars it.
mixin_extras_version=0.5.5

# Compatibility
# EMI (optional recipe-viewer integration): compile-only in `common`, never bundled, not a declared dependency.
emi_version=1.1.24+1.20.1
# Vendored in libs/maven (see libs/maven/README.md): com.github.TheRedBrain:bundle-api-<platform>:<version>
bundle_api_version=1.1.0+1.20.1
better_combat_version=1.9.0+1.20.1
combat_roll_version=1.3.3+1.20.1
shoulder_surfing_version=1.20.1-4.3.1
iris_version=1.6.17+1.20.1
# FTB Teams / FTB Library — 1.20.1 line is the `2001.x.y` series on https://maven.ftb.dev/releases
# (artifacts `dev.ftb.mods:ftb-teams-<platform>` / `ftb-library-<platform>`). Compile-only on every module.
ftb_teams_version=2001.3.2
ftb_library_version=2001.2.13

# Fabric only
trinkets_version=3.7.2
# Cardinal Components nested in Trinkets 3.7.2 (compile classpath only; TrinketComponent extends CCA's ComponentV3)
cardinal_components_version=5.2.0
mod_menu_version=7.2.1
lamb_dynamic_lights_version=2.3.2+1.20.1

# Forge only
curios_version=5.14.1+1.20.1
