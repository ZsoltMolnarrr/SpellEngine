# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Game
minecraft_version=26.1.2
# Game versions this build is released for: colon separated, oldest first; the first one is the manifest minimum.
#   single: minecraft_compat_versions=26.1.2     multiple: minecraft_compat_versions=26.1:26.1.1:26.1.2
minecraft_compat_versions=26.1:26.1.1:26.1.2

# Loader
enabled_platforms = fabric,neoforge
fabric_loader_version=0.19.3
neoforge_version = 26.1.2.94

# Mod
maven_group=net.spell_engine
archives_name=spell_engine
mod_version=1.10.5.006

# Dependencies
fabric_api_version=0.155.2+26.1.2
tiny_config_version=4.0.0
cloth_config_version=26.1.154
player_anim_version=1.2.6+mc.26.1
spell_power_version=1.6.1+26.1.2
ranged_weapon_api_version=4.0.0+26.1.2

critical_strike_version=1.0.2+1.21.1
# Critical Strike has no 26.1 build yet; compat compiled only when true
enable_critical_strike=false

# Compatibility
bundle_api_version=1.1.1+26.1.2
better_combat_version=3.2.2+26.1.2
combat_roll_version=3.0.1+26.1.2
shoulder_surfing_version=26.1.2-5.0.10
iris_version=1.10.9+26.1
ftb_teams_version=26.1.2.4
ftb_library_version=26.1.2.6

# Fabric only
# Trinkets Updated 4.0 (mod id `trinkets_updated`, API package eu.pb4.trinkets.api) no longer uses Cardinal Components;
# it nests yumi-mc-foundation (dev.yumi.mc.core:yumi-mc-foundation) instead.
trinkets_version=4.0.0-rc.1+26.1
mod_menu_version=18.0.0
lamb_dynamic_lights_version=4.10.2+26.1.2

# NeoForge only
curios_version=15.0.0+26.1.2
