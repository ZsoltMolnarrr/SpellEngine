# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Game
minecraft_version=1.21.11
# Game versions this build is released for: colon separated, oldest first; the first one is the manifest minimum.
#   single: minecraft_compat_versions=1.21.11     multiple: minecraft_compat_versions=1.21:1.21.1
minecraft_compat_versions=1.21.11

# Loader
enabled_platforms = fabric,neoforge
fabric_loader_version=0.19.3
neoforge_version = 21.11.45

# Mod
maven_group=net.spell_engine
archives_name=spell_engine
mod_version=1.10.4.008

# Dependencies
fabric_api_version=0.141.6+1.21.11
tiny_config_version=3.1.1
cloth_config_version=21.11.153
player_anim_version=1.1.10+mc.1.21.11
spell_power_version=1.6.1.002+1.21.11
ranged_weapon_api_version=4.0.0.003+1.21.11

critical_strike_version=1.0.2+1.21.1
# Critical Strike has no 1.21.11 build yet; compat compiled only when true
enable_critical_strike=false

# Compatibility
bundle_api_version=1.1.1.004+1.21.11
better_combat_version=3.1.0+1.21.11
combat_roll_version=3.0.1+1.21.11
shoulder_surfing_version=1.21.11-5.0.10
iris_version=1.10.7+1.21.11
ftb_teams_version=2111.1.1
ftb_library_version=2111.1.1

# Fabric only
cardinal_components_version=7.3.0
trinkets_version=3.11.0-beta.2+1.21.11
mod_menu_version=17.0.0
lamb_dynamic_lights_version=4.9.1+1.21.11

# NeoForge only
curios_version=14.0.0+1.21.11
