// Dev-only ecosystem runtime for the SpellEngine workspace (1.20.1 line, Forge 47) — the Forge mirror of
// fabric/workspace-runtime.gradle. Read that file's header for the flag list, the `modLocalRuntime` vs
// `dev-shadow` rationale and the `transitive = false` rule; only the Forge-specific deltas are noted here.
//
// Deltas vs. the Fabric list:
//   • No StructurePoolAPI — the legacy `maven.modrinth:structure-pool-api` artifact is Fabric-only, so
//     Gazebo/Taverns village injection does not happen on Forge (see TESTING.md "known gaps").
//   • Trinkets/Cardinal Components are replaced by Curios, which SpellEngine's forge/build.gradle
//     already puts on the runtime classpath as a `modImplementation`.
//   • Every jar here is SRG-named production output; `modLocalRuntime` is what makes Loom remap it (and
//     its refmaps) into the dev namespace. Pinning the Yarn-named `dev-shadow` classifier instead makes
//     FML's `EventSubclassTransformer` fail with `NoClassDefFoundError: net/minecraft/world/item/Item`
//     and kills item registration for the whole run.

def flags = rootProject.ext.rpgSeriesWorkspace
def accessories = flags.rpg_series_gear || flags.rpg_series_accessories

repositories {
    if (flags.rpg_series_skills) {
        maven { url = 'https://maven.puffish.net' } // Pufferfish's Skills (SkillTree's hard dependency)
    }
    mavenLocal()
}

dependencies {
    // ── Shared RPG Series libraries (all groups) ───────────────────────────────────────────────────────
    modLocalRuntime("net.rpg_foundation:armor_model_api-forge:1.0.0.001+1.20.1") { transitive = false }
    // `modCompileOnly` in SpellEngine's own build.gradle, hence absent from the run classpath by default.
    modLocalRuntime("com.github.TheRedBrain:bundle-api-forge:1.1.0.001") { transitive = false }
    modLocalRuntime("net.critical_strike:critical_strike-forge:1.0.4.002") { transitive = false }
    modLocalRuntime("net.foundation:ranged_weapon_api-forge:2.3.4.001+1.20.1") { transitive = false }
    // JiJ'd by Paladins/Arsenal in production; nested jars of classpath mods are not loaded in dev.
    modLocalRuntime("net.fabric_extras:shield_api-forge:2.2.0.001") { transitive = false }

    // ── Groups ────────────────────────────────────────────────────────────────────────────────────────
    if (flags.rpg_series_classes) {
        modLocalRuntime("net.rpg_series:wizards-forge:3.1.2.005+1.20.1") { transitive = false }
        modLocalRuntime("net.rpg_series:paladins-forge:3.1.1.004+1.20.1") { transitive = false }
        modLocalRuntime("net.rpg_series:rogues-forge:3.1.1.003+1.20.1") { transitive = false }
        modLocalRuntime("net.rpg_series:archers-forge:3.1.1.002+1.20.1") { transitive = false }
    }
    if (flags.rpg_series_gear) {
        modLocalRuntime("net.arsenal:arsenal-forge:1.5.0.001+1.20.1") { transitive = false }
        modLocalRuntime("net.rpg_series:armory-forge:1.5.2.002+1.20.1") { transitive = false }
        modLocalRuntime("net.rpg_series:runes-forge:1.3.2.001+1.20.1") { transitive = false }
    }
    if (accessories) {
        modLocalRuntime("net.rpg_series:jewelry-forge:2.4.0.002+1.20.1") { transitive = false }
        modLocalRuntime("net.rpg_series:relics-forge:1.4.0.002+1.20.1") { transitive = false }
    }
    if (flags.rpg_series_skills) {
        modLocalRuntime("net.rpg_series:skill_tree-forge:1.6.1.003+1.20.1") { transitive = false }
        // No `+1.20.1` line exists: the 1.20/1.20.1 artifact is tagged `+1.20`.
        modLocalRuntime("net.puffish:skillsmod:0.16.7+1.20:forge")
    }
    if (flags.rpg_series_structures) {
        modLocalRuntime("net.rpg_series:gazebo-forge:2.2.0.002+1.20.1") { transitive = false }
        modLocalRuntime("net.rpg_series:village_taverns-forge:1.3.0.001+1.20.1") { transitive = false }
    }
}
