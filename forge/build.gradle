plugins {
    id 'com.gradleup.shadow'
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
}

def platform = project.name;

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    forge {
        // Forge 47 reads mixin configs from the jar MANIFEST (`MixinConfigs: ...`), which Loom writes from
        // this list (the NeoForge `[[mixins]]` table in mods.toml does not exist on Forge 47).
        mixinConfig "spell_engine.mixins.json"
        mixinConfig "spell_engine-forge.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

def generatedResources = project(':common').file('src/main/generated')
sourceSets {
    main {
        resources.srcDir generatedResources
    }
}


configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    // Bundle API for 1.20.1 is vendored from the ZsoltMolnarrr/bundle-api fork (branch `1.20.1-modern`)
    // until upstream publishes a 1.20.1 build to Modrinth. See libs/maven/README.md for the exit path.
    maven {
        name = 'VendoredBundleApi'
        url = uri("${rootProject.projectDir}/libs/maven")
        content { includeGroup 'com.github.TheRedBrain' }
    }
    maven { url 'https://maven.kosmx.dev/' }
    maven { url 'https://maven.shedaniel.me/' }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    // FTB Teams / FTB Library (compile-only, `FTBTeamsCompat`). 1.20.1 = the `2001.x` line.
    maven {
        name = 'FTB'
        url = 'https://maven.ftb.dev/releases'
        content {
            includeGroup 'dev.ftb.mods'
        }
    }

    // For Curios
    maven { url 'https://maven.theillusivec4.top/' }

    mavenLocal()
}

// Ecosystem workspace runtime (opt-in, dev only): puts the RPG Series content mods on the run classpath
// so they can be tested against SpellEngine from source. Enabled per group by a gitignored
// `workspace.properties` next to the root build.gradle (copy workspace.properties.example):
// rpg_series_classes / rpg_series_gear / rpg_series_accessories / rpg_series_skills /
// rpg_series_structures. `-P<flag>=false` overrides it to reproduce CI. CI and fresh clones never
// resolve it. Pins live in workspace-runtime.gradle (tracked); see docs/version-adoption-1.20.1/TESTING.md.
if (rootProject.ext.rpgSeriesWorkspaceAny) {
    apply from: "workspace-runtime.gradle"
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    // Forge 47 ships plain Mixin 0.8.5 only: bundle MixinExtras for the @WrapOperation/@ModifyExpressionValue
    // injectors in common. The forge artifact self-bootstraps through its IMixinConnector service; no plugin call needed.
    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:${rootProject.mixin_extras_version}"))
    implementation(include("io.github.llamalad7:mixinextras-forge:${rootProject.mixin_extras_version}"))

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    modImplementation("dev.kosmx.player-anim:player-animation-lib-forge:${rootProject.player_anim_version}")
    modImplementation("me.shedaniel.cloth:cloth-config-${platform}:${rootProject.cloth_config_version}")

    // Ecosystem libraries: the Modrinth maven for the released ones, mavenLocal for the 1.20.1-modern ports.
    include(modImplementation("maven.modrinth:tiny-config:${rootProject.tiny_config_version}-${platform}"))
    modImplementation("net.spell_power:spell_power-${platform}:${rootProject.spell_power_version}")
    modCompileOnly("com.github.TheRedBrain:bundle-api-${platform}:${rootProject.bundle_api_version}")
    modCompileOnly("net.critical_strike:critical_strike-${platform}:${rootProject.critical_strike_version}")
    // RangedWeaponAPI 2.3.4.001+1.20.1 (mavenLocal; first RWA build with a Forge artifact). Compile-only: optional at
    // runtime, not in the published POM; Spell Engine boots without it. To exercise the RWA path in the dev runtime
    // use the Yarn-named dev-shadow jar (the production jar's SRG mixin targets are skipped in the dev env):
    //   localRuntime("net.foundation:ranged_weapon_api-forge:${rootProject.ranged_weapon_api_version}:dev-shadow")
    modCompileOnly("net.foundation:ranged_weapon_api-${platform}:${rootProject.ranged_weapon_api_version}")

    // Compatibility

    modCompileOnly("maven.modrinth:shoulder-surfing-reloaded:${rootProject.shoulder_surfing_version}+${platform}")
    modCompileOnly("maven.modrinth:better-combat:${rootProject.better_combat_version}-${platform}")
    modCompileOnly("maven.modrinth:combat-roll:${rootProject.combat_roll_version}-${platform}")
    // FTB Teams 2001.x (1.20.1), compile-only — optional at runtime (`FTBTeamsCompat` is `isModLoaded`-gated).
    modCompileOnly("dev.ftb.mods:ftb-teams-${platform}:${rootProject.ftb_teams_version}") { transitive = false }
    modCompileOnly("dev.ftb.mods:ftb-library-${platform}:${rootProject.ftb_library_version}") { transitive = false }
    modCompileOnly("maven.modrinth:iris:${rootProject.iris_version}")

    // Forge specific
    // - Curios 5.x (1.20.1) - https://docs.illusivesoulworks.com/category/curios
    modImplementation("top.theillusivec4.curios:curios-forge:${rootProject.curios_version}")

    // EMI on the dev run classpath only, to verify the recipe viewer integration in `runClient`
    modLocalRuntime("dev.emi:emi-${platform}:${rootProject.emi_version}")
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    atAccessWideners.add("spell_engine.accesswidener")
}

// Publishing is configured unconditionally: tasks only *run* when explicitly invoked
// (e.g. `publishMod` in CI), and all credentials are lazy env providers, so a local
// `build` — with none of the tokens present — is completely unaffected.
def releaseTypeName = (project.findProperty('release_type') ?: 'beta').toString()

// Local convenience alias -- CI invokes the per-destination publish tasks directly.
tasks.register("publishMod") {
    dependsOn(build)
    finalizedBy(tasks.named("publishMods"))
}

publishMods {
    file = remapJar.archiveFile          // Loom production jar (NOT the dev-shadow jar)
    changelog = providers.provider { changelog_last_section() }   // lazy: read only at publish
    type = releaseTypeName == "release" ? me.modmuss50.mpp.ReleaseType.STABLE
            : releaseTypeName == "alpha" ? me.modmuss50.mpp.ReleaseType.ALPHA
            : me.modmuss50.mpp.ReleaseType.BETA
    version = "${project.version}-${platform}"   // per-loader suffix → unique Modrinth version
    displayName = "${project.version}"
    // NeoForge 1.20.1 is a fork of Forge 47.1 that kept the Forge packages and FML,
    // so the same jar loads there; both loaders are tagged.
    modLoaders.add("forge")
    modLoaders.add("neoforge")

    curseforge {
        projectId = providers.environmentVariable("CURSEFORGE_PROJECT_ID")   // numeric id
        accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
        minecraftVersions.add(project.minecraft_version)
        client = true                    // >=1 of client/server REQUIRED by CurseForge (Error 1021)
        server = true
        changelogType = "markdown"
        requires("cloth-config", "playeranimator", "spell-power", "curios")
    }

    modrinth {
        environment = me.modmuss50.mpp.platforms.modrinth.ModrinthEnvironment.CLIENT_AND_SERVER
        projectId = providers.environmentVariable("MODRINTH_PROJECT_RAW_ID")
        accessToken = providers.environmentVariable("MODRINTH_API_KEY")
        minecraftVersions.add(project.minecraft_version)
        requires { slug = "cloth-config" }
        requires { slug = "playeranimator" }
        requires { slug = "spell-power" }
        requires { slug = "curios" }
    }

    // Each platform publishes its own GitHub release under a distinct, platform-suffixed
    // tag (e.g. `1.0.0+1.20.1-forge`), so the two publish jobs don't collide.
    github {
        repository = providers.environmentVariable("GH_OWNER")
                .zip(providers.environmentVariable("GH_REPO")) { owner, repo -> "$owner/$repo" }
        accessToken = providers.environmentVariable("GH_API_KEY")
        tagName = "${project.version}-${platform}"
        // `commitish` is REQUIRED by the plugin. GITHUB_SHA is set automatically by GitHub
        // Actions to the triggering commit — valid even in a detached-HEAD checkout.
        commitish = providers.environmentVariable("GITHUB_SHA")
    }
}

// GitHub release last: a failed mod upload aborts the build before the release exists.
// Ordering only -- unselected tasks are ignored. Must sit after the publishMods block.
tasks.named("publishGithub") {
    mustRunAfter(tasks.named("publishCurseforge"), tasks.named("publishModrinth"))
}
