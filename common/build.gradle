architectury {
    common rootProject.enabled_platforms.split(',')
}

// Dummy platform for common compile
def platform = "fabric";

loom {
    accessWidenerPath = file("src/main/resources/spell_engine.accesswidener")
}

repositories {
    maven { url 'https://maven.kosmx.dev/' }
    maven { url 'https://maven.shedaniel.me/' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    // FTB Teams / FTB Library (compile-only, `FTBTeamsCompat`). 1.20.1 = the `2001.x` line.
    maven {
        name = 'FTB'
        url = 'https://maven.ftb.dev/releases'
        content {
            includeGroup 'dev.ftb.mods'
        }
    }

    mavenLocal()
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    // No Fabric API in common: the common code is loader-neutral (zero `net.fabricmc.fabric` imports), and
    // there is no Forgified Fabric API on the 1.20.1 line — loader API goes through Platform*/PlatformEvents.

    // MixinExtras annotation processor: lets the Mixin AP refmap the @WrapOperation targets, which the
    // Forge production jar needs (SRG names at runtime). Fabric Loader bundles the runtime.
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${rootProject.mixin_extras_version}"))

    modImplementation("dev.kosmx.player-anim:player-animation-lib-${platform}:${rootProject.player_anim_version}")
    modImplementation("me.shedaniel.cloth:cloth-config-${platform}:${rootProject.cloth_config_version}")

    // Ecosystem libraries from mavenLocal (published by their 1.20.1-modern ports).
    modImplementation("net.tiny_config:tiny_config-${platform}:${rootProject.tiny_config_version}")
    modImplementation("net.spell_power:spell_power-${platform}:${rootProject.spell_power_version}")
    modCompileOnly("com.github.TheRedBrain:bundle-api-${platform}:${rootProject.bundle_api_version}")
    modCompileOnly("net.critical_strike:critical_strike-${platform}:${rootProject.critical_strike_version}")
    // RangedWeaponAPI 2.3.4.001+1.20.1 (mavenLocal, Fabric + Forge). Compile-only: RWA is an *optional* runtime
    // dependency — `RangedWeapon(s)` only touch RWA classes when a content mod registers ranged weapons, and
    // `ExternalSpellSchools` gates its RWA bridge on `isModLoaded("ranged_weapon_api")`.
    modCompileOnly("net.foundation:ranged_weapon_api-${platform}:${rootProject.ranged_weapon_api_version}")

    // Compatibility

    modCompileOnly("maven.modrinth:shoulder-surfing-reloaded:${rootProject.shoulder_surfing_version}+${platform}")
    modCompileOnly("maven.modrinth:better-combat:${rootProject.better_combat_version}-${platform}")
    modCompileOnly("maven.modrinth:combat-roll:${rootProject.combat_roll_version}-${platform}")
    // FTB Teams 2001.x (1.20.1). FTB Library is needed on the compile classpath only because `Team` /
    // `TeamRank` mention `dev.ftb.mods.ftblibrary.{icon.Color4I,config.NameMap}` in their signatures.
    modCompileOnly("dev.ftb.mods:ftb-teams-${platform}:${rootProject.ftb_teams_version}") { transitive = false }
    modCompileOnly("dev.ftb.mods:ftb-library-${platform}:${rootProject.ftb_library_version}") { transitive = false }
    modCompileOnly("maven.modrinth:iris:${rootProject.iris_version}")

}
