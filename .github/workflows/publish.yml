name: Publish

on:
  workflow_dispatch:
    inputs:
      fabric:
        type: boolean
        description: 'Loader: Fabric'
        default: true
      neoforge:
        type: boolean
        description: 'Loader: NeoForge'
        default: true
      release_type:
        type: choice
        description: Release type
        options:
          - release
          - beta
          - alpha
      curseforge:
        type: boolean
        description: 'Platform: CurseForge'
        default: true
      modrinth:
        type: boolean
        description: 'Platform: Modrinth'
        default: true
      github:
        type: boolean
        description: 'Platform: GitHub Release'
        default: true

permissions:
  contents: read

jobs:
  # Separate job because an empty matrix would silently run zero jobs.
  plan:
    runs-on: ubuntu-latest
    outputs:
      loaders: ${{ steps.plan.outputs.loaders }}
      destinations: ${{ steps.plan.outputs.destinations }}
    steps:
      - name: Resolve build plan
        id: plan
        # `if` blocks, not `&&` chains: `${{ inputs.x }}` is a bare `false`, which aborts under `set -e`.
        run: |
          set -euo pipefail

          loaders=""
          if [ "${{ inputs.fabric }}"   = "true" ]; then loaders="$loaders fabric";   fi
          if [ "${{ inputs.neoforge }}" = "true" ]; then loaders="$loaders neoforge"; fi

          destinations=""
          if [ "${{ inputs.curseforge }}" = "true" ]; then destinations="$destinations publishCurseforge"; fi
          if [ "${{ inputs.modrinth }}"   = "true" ]; then destinations="$destinations publishModrinth";   fi
          if [ "${{ inputs.github }}"     = "true" ]; then destinations="$destinations publishGithub";     fi

          loaders="${loaders# }"
          destinations="${destinations# }"

          if [ -z "$loaders" ]; then
            echo "::error::No loader selected - tick at least one of Fabric / NeoForge."
            exit 1
          fi
          if [ -z "$destinations" ]; then
            echo "::error::No platform selected - tick at least one of CurseForge / Modrinth / GitHub Release."
            exit 1
          fi

          json=""
          for l in $loaders; do json="$json${json:+,}\"$l\""; done

          echo "loaders=[$json]" >> "$GITHUB_OUTPUT"
          echo "destinations=$destinations" >> "$GITHUB_OUTPUT"
          echo "Loaders: $loaders | Platforms: $destinations | Release: ${{ inputs.release_type }}"

  build:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # never cancel a sibling mid-upload
      matrix:
        loader: ${{ fromJSON(needs.plan.outputs.loaders) }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Resolve Gradle tasks
        id: targets
        # `build` is explicit: the publish tasks depend on remapJar, not on build/check.
        run: |
          set -euo pipefail
          tasks=":${{ matrix.loader }}:build"
          for d in ${{ needs.plan.outputs.destinations }}; do
            tasks="$tasks :${{ matrix.loader }}:$d"
          done
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"
          echo "Publishing ${{ matrix.loader }} via: $tasks"
      - name: Build with Gradle
        uses: gradle/gradle-build-action@67421db6bd0bf253fb4bd25b31ebb98943c375e1
        with:
          arguments: ${{ steps.targets.outputs.tasks }} -Prelease_type=${{ inputs.release_type }}
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          MODRINTH_API_KEY: ${{ secrets.MODRINTH_API_KEY }}
          MODRINTH_PROJECT_RAW_ID: ${{ vars.MODRINTH_PROJECT_RAW_ID }}
          GH_API_KEY: ${{ secrets.GH_API_KEY }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
