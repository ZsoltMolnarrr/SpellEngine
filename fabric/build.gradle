plugins {
    id 'com.gradleup.shadow'
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
}

def platform = project.name;

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

fabricApi {
    configureDataGeneration() {
        client = true
        modId = "spell_engine"
        outputDirectory = project(':common').file('src/main/generated')
    }
}


configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url 'https://maven.kosmx.dev/' }
    maven { url 'https://maven.shedaniel.me/' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    // Trinkets 3.7.x (1.20.1) is no longer served by maven.ladysnake.org; resolved from the Modrinth maven.
    // Cardinal Components (Trinkets' nested dependency) still is.
    maven {
        name = 'Ladysnake'
        url = 'https://maven.ladysnake.org/releases'
        content {
            includeGroup 'dev.onyxstudios.cardinal-components-api'
        }
    }
    // TODO 1.20.1: FTB maven dropped together with the FTB Teams/Library deps (no 1.20.1 pin yet).

    mavenLocal()
}

// Ecosystem workspace runtime (opt-in, dev only): puts the RPG Series content mods on the run classpath
// so they can be tested against SpellEngine from source. Enabled per group by a gitignored
// `workspace.properties` next to the root build.gradle (copy workspace.properties.example):
// rpg_series_classes / rpg_series_gear / rpg_series_accessories / rpg_series_skills. `-P<flag>=false`
// overrides it to reproduce CI. CI and fresh clones never resolve it.
// Pins live in workspace-runtime.gradle (tracked).
if (rootProject.ext.rpgSeriesWorkspaceAny) {
    apply from: "workspace-runtime.gradle"
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    modImplementation("dev.kosmx.player-anim:player-animation-lib-${platform}:${rootProject.player_anim_version}")
    modImplementation("me.shedaniel.cloth:cloth-config-${platform}:${rootProject.cloth_config_version}")

    // Ecosystem libraries from mavenLocal (published by their 1.20.1-modern ports).
    include(modImplementation("net.tiny_config:tiny_config-${platform}:${rootProject.tiny_config_version}"))
    modImplementation("net.spell_power:spell_power-${platform}:${rootProject.spell_power_version}")
    modCompileOnly("com.github.TheRedBrain:bundle-api-${platform}:${rootProject.bundle_api_version}")
    modCompileOnly("net.critical_strike:critical_strike-${platform}:${rootProject.critical_strike_version}")
    // RangedWeaponAPI: legacy published Fabric-only artifact (Modrinth maven); runtime dependency on Fabric only.
    modImplementation("maven.modrinth:ranged-weapon-api:${rootProject.ranged_weapon_api_version}")

    // Compatibility

    modCompileOnly("maven.modrinth:shoulder-surfing-reloaded:${rootProject.shoulder_surfing_version}+${platform}")
    modCompileOnly("maven.modrinth:better-combat:${rootProject.better_combat_version}-${platform}")
    modCompileOnly("maven.modrinth:combat-roll:${rootProject.combat_roll_version}-${platform}")
    // TODO 1.20.1: FTB Teams / FTB Library dropped (no 1.20.1 pin on the legacy branch).
//    modCompileOnly("dev.ftb.mods:ftb-teams-${platform}:${rootProject.ftb_teams_version}")
//    modCompileOnly("dev.ftb.mods:ftb-library-${platform}:${rootProject.ftb_library_version}")

    modCompileOnly("maven.modrinth:iris:${rootProject.iris_version}")

    // Fabric specific
    modImplementation("maven.modrinth:modmenu:${rootProject.mod_menu_version}")
    modImplementation("maven.modrinth:trinkets:${rootProject.trinkets_version}")
    // Trinkets 3.7.2 nests (JiJ) Cardinal Components 5.2.0, which Loom neither puts on the compile classpath nor
    // unpacks for dev runs (nested jars of classpath mods are not loaded in dev). `TrinketComponent extends
    // ComponentV3`, so javac needs it; runDatagen/runServer need it loaded. `modLocalRuntime` keeps it out of the
    // published POM (production gets it from Trinkets' own nested jars).
    modCompileOnly("dev.onyxstudios.cardinal-components-api:cardinal-components-base:${rootProject.cardinal_components_version}")
    modCompileOnly("dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${rootProject.cardinal_components_version}")
    modLocalRuntime("dev.onyxstudios.cardinal-components-api:cardinal-components-base:${rootProject.cardinal_components_version}")
    modLocalRuntime("dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${rootProject.cardinal_components_version}")

    modCompileOnly("maven.modrinth:lambdynamiclights:${rootProject.lamb_dynamic_lights_version}")
}

processResources {
    inputs.property 'version', project.version

    filesMatching("fabric.mod.json") {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    injectAccessWidener = true
    inputFile.set shadowJar.archiveFile
}

// Publishing is configured unconditionally: tasks only *run* when explicitly invoked
// (e.g. `publishMod` in CI), and all credentials are lazy env providers, so a local
// `build` — with none of the tokens present — is completely unaffected.
def releaseTypeName = (project.findProperty('release_type') ?: 'beta').toString()

// Local convenience alias -- CI invokes the per-destination publish tasks directly.
tasks.register("publishMod") {
    dependsOn(build)
    finalizedBy(tasks.named("publishMods"))
}

publishMods {
    file = remapJar.archiveFile          // Loom production jar (NOT the dev-shadow jar)
    changelog = providers.provider { changelog_last_section() }   // lazy: read only at publish
    type = releaseTypeName == "release" ? me.modmuss50.mpp.ReleaseType.STABLE
            : releaseTypeName == "alpha" ? me.modmuss50.mpp.ReleaseType.ALPHA
            : me.modmuss50.mpp.ReleaseType.BETA
    version = "${project.version}-${platform}"   // per-loader suffix → unique Modrinth version
    displayName = "${project.version}"
    modLoaders.add("fabric")

    curseforge {
        projectId = providers.environmentVariable("CURSEFORGE_PROJECT_ID")   // numeric id
        accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
        minecraftVersions.add(project.minecraft_version)
        client = true                    // >=1 of client/server REQUIRED by CurseForge (Error 1021)
        server = true
        changelogType = "markdown"
        requires("fabric-api", "cloth-config", "playeranimator", "spell-power", "trinkets")
    }

    modrinth {
        environment = me.modmuss50.mpp.platforms.modrinth.ModrinthEnvironment.CLIENT_AND_SERVER
        projectId = providers.environmentVariable("MODRINTH_PROJECT_RAW_ID")
        accessToken = providers.environmentVariable("MODRINTH_API_KEY")
        minecraftVersions.add(project.minecraft_version)
        requires { slug = "fabric-api" }
        requires { slug = "cloth-config" }
        requires { slug = "playeranimator" }
        requires { slug = "spell-power" }
        requires { slug = "trinkets" }
    }

    // Each platform publishes its own GitHub release under a distinct, platform-suffixed
    // tag (e.g. `1.0.0+1.20.1-fabric`), so the two publish jobs don't collide.
    github {
        repository = providers.environmentVariable("GH_OWNER")
                .zip(providers.environmentVariable("GH_REPO")) { owner, repo -> "$owner/$repo" }
        accessToken = providers.environmentVariable("GH_API_KEY")
        tagName = "${project.version}-${platform}"
        // `commitish` is REQUIRED by the plugin. GITHUB_SHA is set automatically by GitHub
        // Actions to the triggering commit — valid even in a detached-HEAD checkout.
        commitish = providers.environmentVariable("GITHUB_SHA")
    }
}

// GitHub release last: a failed mod upload aborts the build before the release exists.
// Ordering only -- unselected tasks are ignored. Must sit after the publishMods block.
tasks.named("publishGithub") {
    mustRunAfter(tasks.named("publishCurseforge"), tasks.named("publishModrinth"))
}
