plugins {
    id 'com.gradleup.shadow'
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
}

def platform = project.name;

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

fabricApi {
    configureDataGeneration() {
        client = true
        modId = "spell_engine"
        outputDirectory = project(':common').file('src/main/generated')
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url = 'https://repo.redlance.org/public' } // PAL (Player Animation Library)
    maven { url = 'https://maven.shedaniel.me/' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = "Sleeping Town"
        url = "https://repo.sleeping.town/"
    }
    maven {
        name = "Ladysnake Libs"
        url = 'https://maven.ladysnake.org/releases'
    }
    maven {
        name = "gegy (LambDynamicLights API)"
        url = 'https://maven.gegy.dev/releases/'
    }
    exclusiveContent {
        forRepository {
            maven {
                url = "https://maven.ftb.dev/releases"
            }
        }
        filter {
            includeGroup"dev.latvian.mods"
            includeGroup"dev.ftb.mods"
        }
    }
    // JEI Maven currently required by FTB
    maven {
        name "ModMaven (JEI)"
        url "https://modmaven.dev/"
        content {
            includeGroup "mezz.jei"
        }
    }

    mavenLocal()
}

// Ecosystem workspace runtime (opt-in, dev only): puts the RPG Series content mods on the run classpath
// so they can be tested against SpellEngine from source. Enabled per group by a gitignored
// `workspace.properties` next to the root build.gradle (copy workspace.properties.example):
// rpg_series_classes / rpg_series_gear / rpg_series_accessories / rpg_series_skills. `-P<flag>=false`
// overrides it to reproduce CI. CI and fresh clones never resolve it.
// Pins live in workspace-runtime.gradle (tracked). See LESSONS §4.39.
if (rootProject.ext.rpgSeriesWorkspaceAny) {
    apply from: "workspace-runtime.gradle"
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    implementation("com.zigythebird.playeranim:PlayerAnimationLibFabric:${project.player_anim_version}")
    implementation("me.shedaniel.cloth:cloth-config-${platform}:${project.cloth_config_version}")

    include(implementation("maven.modrinth:tiny-config:${project.tiny_config_version}-${platform}"))
//    implementation("net.tiny_config:tiny_config-${platform}:${project.tiny_config_version}")
//    implementation("maven.modrinth:spell-power:${project.spell_power_version}-${platform}")
    implementation("net.spell_power:spell_power-${platform}:${project.spell_power_version}")
//    implementation("maven.modrinth:ranged-weapon-api:${project.ranged_weapon_api_version}-${platform}")
    implementation("net.rpg_foundation:ranged_weapon_api-${platform}:${project.ranged_weapon_api_version}")
//    compileOnly("maven.modrinth:bundle-api:${project.bundle_api_version}-${platform}")
    compileOnly("com.github.TheRedBrain:bundle-api-${platform}:${project.bundle_api_version}")
    if (rootProject.enable_critical_strike.toBoolean()) {
        compileOnly("maven.modrinth:critical-strike:${project.critical_strike_version}-${platform}")
    }

    // Compatibility

    compileOnly("maven.modrinth:shoulder-surfing-reloaded:${project.shoulder_surfing_version}+${platform}")
    compileOnly("maven.modrinth:better-combat:${project.better_combat_version}-${platform}")
//    compileOnly("net.bettercombat:bettercombat-${platform}:${project.better_combat_version}") { transitive = false }
    compileOnly("maven.modrinth:combat-roll:${project.combat_roll_version}-${platform}")
    compileOnly("dev.ftb.mods:ftb-teams-${platform}:${project.ftb_teams_version}")
    compileOnly("dev.ftb.mods:ftb-library-${platform}:${project.ftb_library_version}")

    compileOnly("maven.modrinth:iris:${project.iris_version}-${platform}")

    // Fabric specific
    implementation("maven.modrinth:modmenu:${project.mod_menu_version}")
    // Trinkets Updated 4.0 (Patbox): mod id `trinkets_updated`, API package `eu.pb4.trinkets.api` (rewrite of dev.emi.trinkets).
    // No Cardinal Components any more; it nests yumi-mc-foundation (dev.yumi.mc.core:yumi-mc-foundation, no public maven found).
    implementation("maven.modrinth:trinkets-updated:${project.trinkets_version}")

    compileOnly("dev.lambdaurora.lambdynamiclights:lambdynamiclights-api:${project.lamb_dynamic_lights_version}")
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_min_version', rootProject.minecraft_min_version

    filesMatching("fabric.mod.json") {
        expand(project.properties + [minecraft_min_version: rootProject.minecraft_min_version])
    }
}

// Minecraft is not obfuscated on this version, so there is no remapJar task.
// The shaded jar is the mod jar that ships.
jar {
    archiveClassifier = 'dev'
}

shadowJar {
    // Build on top of the `jar` task output instead of raw source-set outputs:
    // in no-remap Loom the jar-in-jar nesting (`include`, TinyConfig) is applied by `jar`
    // (it was applied by `remapJar` after shadowing, before 26.1).
    dependsOn jar
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
}

assemble.dependsOn shadowJar

// The access widener (common/src/main/resources/spell_engine.accesswidener) is only *shipped* if it is also
// referenced from fabric.mod.json. With no remapJar, Loom 1.17's injection API does that on the shadow jar:
// it copies the AW top-level into the jar and adds the "accessWidener" key to fabric.mod.json (doLast action).
loom.injectAccessWidener(tasks.named('shadowJar'))

// Publish the shaded jar (common + platform classes) as the main artifact.
configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

// Publishing is configured unconditionally: tasks only *run* when explicitly invoked
// (e.g. `publishMod` in CI), and all credentials are lazy env providers, so a local
// `build` — with none of the tokens present — is completely unaffected.
def releaseTypeName = (project.findProperty('release_type') ?: 'beta').toString()

// Local convenience alias -- CI invokes the per-destination publish tasks directly.
tasks.register("publishMod") {
    dependsOn(build)
    finalizedBy(tasks.named("publishMods"))
}

publishMods {
    file = shadowJar.archiveFile         // the shaded jar is the shipped jar on 26.1+ (no remapJar)
    changelog = providers.provider { changelog_last_section() }   // lazy: read only at publish
    type = releaseTypeName == "release" ? me.modmuss50.mpp.ReleaseType.STABLE
            : releaseTypeName == "alpha" ? me.modmuss50.mpp.ReleaseType.ALPHA
            : me.modmuss50.mpp.ReleaseType.BETA
    version = "${project.version}-${platform}"   // per-loader suffix → unique Modrinth version
    displayName = "${project.version}"
    modLoaders.add("fabric")

    curseforge {
        projectId = providers.environmentVariable("CURSEFORGE_PROJECT_ID")   // numeric id
        accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
        minecraftVersions.addAll(rootProject.minecraftCompatVersions)
        client = true                    // >=1 of client/server REQUIRED by CurseForge (Error 1021)
        server = true
        changelogType = "markdown"
        requires("fabric-api", "cloth-config", "player-animation-library", "spell-power", "trinkets-updated")
    }

    modrinth {
        environment = me.modmuss50.mpp.platforms.modrinth.ModrinthEnvironment.CLIENT_AND_SERVER
        projectId = providers.environmentVariable("MODRINTH_PROJECT_RAW_ID")
        accessToken = providers.environmentVariable("MODRINTH_API_KEY")
        minecraftVersions.addAll(rootProject.minecraftCompatVersions)
        requires { slug = "fabric-api" }
        requires { slug = "cloth-config" }
        requires { slug = "player-animation-library" }
        requires { slug = "spell-power" }
        requires { slug = "trinkets-updated" }
    }

    // Each platform publishes its own GitHub release under a distinct, platform-suffixed
    // tag (e.g. `1.0.0+1.21.1-fabric`), so the two publish jobs don't collide.
    github {
        repository = providers.environmentVariable("GH_OWNER")
                .zip(providers.environmentVariable("GH_REPO")) { owner, repo -> "$owner/$repo" }
        accessToken = providers.environmentVariable("GH_API_KEY")
        tagName = "${project.version}-${platform}"
        // `commitish` is REQUIRED by the plugin. GITHUB_SHA is set automatically by GitHub
        // Actions to the triggering commit — valid even in a detached-HEAD checkout.
        commitish = providers.environmentVariable("GITHUB_SHA")
    }
}

// GitHub release last: a failed mod upload aborts the build before the release exists.
// Ordering only -- unselected tasks are ignored. Must sit after the publishMods block.
tasks.named("publishGithub") {
    mustRunAfter(tasks.named("publishCurseforge"), tasks.named("publishModrinth"))
}
