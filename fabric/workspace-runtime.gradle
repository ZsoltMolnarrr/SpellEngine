// Dev-only ecosystem runtime for the SpellEngine workspace (1.20.1 line) — applied by build.gradle ONLY
// when at least one group flag is enabled in the gitignored `workspace.properties`
// (template: workspace.properties.example at the repo root):
//
//   rpg_series_classes      Wizards, Paladins, Rogues, Archers
//   rpg_series_gear         Arsenal, Armory, Jewelry, Relics, Runes
//   rpg_series_accessories  Jewelry, Relics only — the 1.21.1 flag name, kept so an existing
//                           workspace.properties still means something. It is a *subset* of
//                           rpg_series_gear; enabling gear already enables it.
//   rpg_series_skills       SkillTree + Pufferfish's Skills
//   rpg_series_structures   Gazebo, Village Taverns
//
// The shared libraries and the third-party runtime set below load with *any* group, because every group
// needs some of them and a half-loaded library set only produces noise. CI and other developers never
// evaluate this file (`rpgSeriesWorkspaceAny` is false without workspace.properties / -P flags).
//
// ── Why `modLocalRuntime` and NOT `localRuntime(... :dev-shadow)` ──────────────────────────────────────
// The 1.21.1 script pins named `dev-shadow` jars with `localRuntime`. That does not work on this line:
// a `dev-shadow` jar is Yarn-named, and on Forge FML's `EventSubclassTransformer` walks the class
// hierarchy of every mod class through the *runtime* (SRG-ish dev) naming, so a Yarn-named jar dropped
// straight on the classpath makes it throw `NoClassDefFoundError: net/minecraft/world/item/Item` and
// takes down item registration for every mod in the run. `modLocalRuntime` hands the *production* jar
// (intermediary on Fabric, SRG on Forge) to Loom, which remaps it — including its mixin refmaps — into
// the dev namespace, which is what both loaders expect. `dev-shadow` remains correct only for jars
// dropped unremapped into `run/mods`.
//
// `transitive = false` everywhere: every content-mod POM lists `net.spell_engine:spell_engine-fabric` as
// a runtime dependency, and pulling it would put a second `spell_engine` mod jar next to the one built
// from source in this workspace. Everything those POMs would have contributed is pinned explicitly below.
//
// Bumping a pin: `./gradlew publishToMavenLocal` from that mod's `1.20.1-modern` worktree, then edit the
// version here AND in forge/workspace-runtime.gradle. Versions are deliberately hardcoded (not read from
// gradle.properties) so the whole tested set is visible in one place — see
// docs/version-adoption-1.20.1/TESTING.md for the table this file must stay in sync with.
//
// ── Why Spell Engine itself is pinned onto the remap classpath ─────────────────────────────────────────
// `transitive = false` has a sharp edge that only shows up at runtime, as a NoSuchMethodError.
// Loom builds tiny-remapper's classpath from the Minecraft jars plus the files of EVERY remap
// configuration, then remaps the pinned jars against it. An *inherited* member is resolved by walking the
// owner's class hierarchy, so `hydra.isAlive()` — javac emits it as
// `invokevirtual net/wizards/entity/FireHydraEntity.method_5805()`, owner = the static receiver type —
// is only remappable if the walk `FireHydraEntity -> net.spell_engine.entity.SummonedEntity ->
// net.minecraft.class_1427` can complete. It cannot: `transitive = false` strips `spell_engine` from
// every pin, and the Spell Engine *in this workspace* is the source project, already in the dev
// namespace, so it cannot terminate an intermediary-namespace walk either. tiny-remapper silently leaves
// the call unmapped and the first Fire Hydra to render kills the client with
// `NoSuchMethodError: net.wizards.entity.FireHydraEntity.method_5805()`. Wizards, Paladins, Rogues and
// SkillTree all had such call sites; Forge had the identical damage with SRG names (`m_6084_`).
//
// The cure is to hand tiny-remapper the *production* (intermediary/SRG) Spell Engine jar through a remap
// configuration that is on NO classpath — it reaches the remapper, its own remapped output lands in a
// sink configuration nothing reads, and it never becomes a second `spell_engine` mod in the run.
// The pin below only has to be recent enough to carry the class hierarchy the pinned content mods
// extend; bump it if a content mod starts extending a Spell Engine type this build predates. After
// changing it (or any pin), delete `.gradle/loom-cache/remapped_mods` so half-remapped jars are rebuilt.

def flags = rootProject.ext.rpgSeriesWorkspace
def accessories = flags.rpg_series_gear || flags.rpg_series_accessories

repositories {
    if (flags.rpg_series_skills) {
        maven { url = 'https://maven.puffish.net' } // Pufferfish's Skills (SkillTree's hard dependency)
    }
    mavenLocal()
}

// Remap-classpath-only configuration: `onCompileClasspath`/`onRuntimeClasspath` false keeps both the
// pinned jar and its remapped output off every classpath; only Loom's remapper ever reads it. The
// remapped output is parked in an inert sink configuration, and `publishingMode` defaults to NONE, so
// nothing here can leak into SpellEngine's own published POM.
configurations.maybeCreate('remapClasspathOnlySink')
loom.addRemapConfiguration('modRemapClasspathOnly') {
    sourceSet = sourceSets.main
    targetConfigurationName = 'remapClasspathOnlySink'
    onCompileClasspath = false
    onRuntimeClasspath = false
}

dependencies {
    // ── Remap classpath only (never loaded) ───────────────────────────────────────────────────────────
    // See the header: without this the pinned mods' calls to members they inherit from Spell Engine
    // classes stay in the production namespace and blow up as NoSuchMethodError at render time.
    modRemapClasspathOnly("net.spell_engine:spell_engine-fabric:1.10.5.013+1.20.1") { transitive = false }

    // ── Shared RPG Series libraries (all groups) ───────────────────────────────────────────────────────
    // ArmorModelAPI renders the class-mod / Armory armor sets; without it those sets fall back to the
    // vanilla layer and the port's armor rendering is untested.
    modLocalRuntime("net.rpg_foundation:armor_model_api-fabric:1.0.0.001+1.20.1") { transitive = false }
    // BundleAPI, Critical Strike and RangedWeaponAPI are `modCompileOnly` in SpellEngine's own
    // build.gradle (optional at runtime), so they are absent from the run classpath unless pinned here.
    modLocalRuntime("com.github.TheRedBrain:bundle-api-fabric:1.1.0.001") { transitive = false }
    modLocalRuntime("net.critical_strike:critical_strike-fabric:1.0.4.002") { transitive = false }
    modLocalRuntime("net.foundation:ranged_weapon_api-fabric:2.3.4.009+1.20.1") { transitive = false }
    // ShieldAPI is JiJ'd by Paladins/Arsenal in production; Loom does not unpack nested jars of
    // classpath mods, so the dev runtime needs it explicitly.
    modLocalRuntime("net.fabric_extras:shield_api-fabric:2.2.0.001") { transitive = false }
    // StructurePoolAPI is a *hard* dependency of the four class mods, Jewelry, Gazebo and Taverns
    // (vanilla-village piece injection). Since 1.2.1.001 it has a Forge artifact too, so
    // forge/workspace-runtime.gradle now carries the matching pin.
    modLocalRuntime("net.foundation:structure_pool_api-fabric:1.2.1.001+1.20.1") { transitive = false }

    // ── Groups ────────────────────────────────────────────────────────────────────────────────────────
    if (flags.rpg_series_classes) {
        modLocalRuntime("net.rpg_series:wizards-fabric:3.1.2.007+1.20.1") { transitive = false }
        modLocalRuntime("net.rpg_series:paladins-fabric:3.1.1.008+1.20.1") { transitive = false }
        modLocalRuntime("net.rpg_series:rogues-fabric:3.1.1.007+1.20.1") { transitive = false }
        modLocalRuntime("net.rpg_series:archers-fabric:3.1.1.006+1.20.1") { transitive = false }
    }
    if (flags.rpg_series_gear) {
        modLocalRuntime("net.arsenal:arsenal-fabric:1.5.0.001+1.20.1") { transitive = false }
        modLocalRuntime("net.rpg_series:armory-fabric:1.5.2.004+1.20.1") { transitive = false }
        // Runes is also a soft runtime dependency of the class mods (their gear carries rune slots).
        modLocalRuntime("net.rpg_series:runes-fabric:1.3.2.001+1.20.1") { transitive = false }
    }
    if (accessories) {
        modLocalRuntime("net.rpg_series:jewelry-fabric:2.4.0.004+1.20.1") { transitive = false }
        modLocalRuntime("net.rpg_series:relics-fabric:1.4.0.002+1.20.1") { transitive = false }
    }
    if (flags.rpg_series_skills) {
        modLocalRuntime("net.rpg_series:skill_tree-fabric:1.6.1.004+1.20.1") { transitive = false }
        // No `+1.20.1` line exists: the 1.20/1.20.1 artifact is tagged `+1.20`.
        modLocalRuntime("net.puffish:skillsmod:0.16.7+1.20:fabric")
    }
    if (flags.rpg_series_structures) {
        modLocalRuntime("net.rpg_series:gazebo-fabric:2.2.0.003+1.20.1") { transitive = false }
        modLocalRuntime("net.rpg_series:village_taverns-fabric:1.3.0.003+1.20.1") { transitive = false }
    }
}

// ── Sodium / Iris compatibility: pin LWJGL to Minecraft 1.20.1's own 3.3.1 ─────────────────────────────
// Loom puts `org.lwjgl:*:3.3.2` DIRECTLY on runtimeClasspath (its macOS-arm64 workaround), so Gradle's
// conflict resolution picks 3.3.2 over the 3.3.1 that the 1.20.1 version manifest asks for. Sodium 0.5.x
// aborts at pre-launch unless the running LWJGL is EXACTLY 3.3.1 — the version is hardcoded in
// `PreLaunchChecks` and there is no bypass system property. Vanilla 1.20.1 ships 3.3.1, so forcing it
// back here just makes the dev runtime match production.
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.lwjgl') {
            details.useVersion '3.3.1'
            details.because 'Sodium 0.5.x requires exactly LWJGL 3.3.1 (the Minecraft 1.20.1 manifest version)'
        }
    }
}

// Launch the dev client/server on Java 17 (what Minecraft 1.20.1 ships with) while Gradle itself keeps
// running on JDK 21 (required by Loom 1.17's `unpick`). Without this, LWJGL 3.3.1's natives log
// "[ThreadLocalUtil] Unsupported JNI version detected, this may result in a crash" under a 21 launcher.
def java17 = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
    javaLauncher = java17
}
