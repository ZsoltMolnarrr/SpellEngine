// Dev-only ecosystem runtime for the SpellEngine workspace — applied by build.gradle ONLY when at least
// one group flag is enabled in the gitignored `workspace.properties` (template: workspace.properties.example):
//   rpg_series_classes      Archers, Wizards, Paladins, Rogues
//   rpg_series_gear         Arsenal, Armory
//   rpg_series_accessories  Jewelry, Relics
//   rpg_series_structures   Gazebo, Taverns
//   rpg_series_skills       SkillTree (+ Pufferfish Skills)
// Shared libraries the groups depend on (ArmorModelAPI, Runes, StructurePoolAPI, BundleAPI) load with any group.
// CI and other developers never evaluate this file.
//
// 26.1+: the game is unobfuscated, the published platform jar is the shaded main artifact (no `dev-shadow`
// classifier any more) and goes straight on the runtime classpath. See LESSONS_1.21.11_TO_26.1 §1.
//
// After publishing a content mod to mavenLocal, bump its pin here (and in the other loader's copy).

def flags = rootProject.ext.rpgSeriesWorkspace

repositories {
    if (flags.rpg_series_skills) {
        maven { url = 'https://maven.puffish.net' } // Pufferfish Skills (SkillTree's hard dependency)
    }
    // Released shared libraries; also Pufferfish Skills 26.3.
    // TODO 26.3: back to net.puffish:skillsmod:0.19.1+26.3:fabric once maven.puffish.net has it — the 26.3
    // build is on Modrinth only, and both loader files share the version number, so it is pinned by version id.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    mavenLocal()
}

dependencies {
    // Shared libraries
    localRuntime("maven.modrinth:armor-model-api:1.1.2+26.3-fabric") { transitive = false }
    localRuntime("maven.modrinth:runes:1.3.2+26.3-fabric") { transitive = false }
    localRuntime("maven.modrinth:structure-pool-api:1.3.0+26.3-fabric") { transitive = false }
    localRuntime("maven.modrinth:bundle-api:5.0.0+26.3-fabric") { transitive = false }
    localRuntime("maven.modrinth:critical-strike:1.0.6+26.3-fabric") { transitive = false } // used by SkillTree/Jewelry configs (critical_strike:chance)

    if (flags.rpg_series_classes) {
    localRuntime("net.rpg_series:archers-fabric:3.1.2.002+26.3") { transitive = false }
    localRuntime("net.rpg_series:wizards-fabric:3.1.2.002+26.3") { transitive = false }
    localRuntime("net.rpg_series:paladins-fabric:3.1.2.002+26.3") { transitive = false }
    localRuntime("net.rpg_series:rogues-fabric:3.1.2.002+26.3") { transitive = false }
    }
    if (flags.rpg_series_gear) {
    localRuntime("net.arsenal:arsenal-fabric:1.5.1.002+26.3") { transitive = false }
    localRuntime("net.rpg_series:armory-fabric:1.5.2.002+26.3") { transitive = false }
    }
    if (flags.rpg_series_accessories) {
    localRuntime("net.rpg_series:jewelry-fabric:2.4.1.002+26.3") { transitive = false }
    localRuntime("net.rpg_series:relics-fabric:1.4.1.002+26.3") { transitive = false }
    }
    if (flags.rpg_series_structures) {
    localRuntime("net.rpg_series:gazebo-fabric:2.2.0.001+26.3") { transitive = false }
    localRuntime("net.rpg_series:village_taverns-fabric:1.3.0.001+26.3") { transitive = false }
    }
    if (flags.rpg_series_skills) {
    localRuntime("net.rpg_series:skill_tree-fabric:1.6.1.002+26.3") { transitive = false }
        // TODO 26.3: back to net.puffish:skillsmod:0.19.1+26.3:fabric once maven.puffish.net has it
        //localRuntime("net.puffish:skillsmod:0.18.3+26.2:fabric")
        localRuntime("maven.modrinth:skills:BciLrdpV") // Pufferfish Skills 0.19.1+26.3 (fabric), pinned by Modrinth version id
    }
}
