// Dev-only ecosystem runtime for the SpellEngine workspace — applied by build.gradle ONLY when at least
// one group flag is enabled in the gitignored `workspace.properties` (template: workspace.properties.example):
//   rpg_series_classes      Archers, Wizards, Paladins, Rogues
//   rpg_series_gear         Arsenal, Armory
//   rpg_series_accessories  Jewelry, Relics
//   rpg_series_structures   Gazebo, Taverns
//   rpg_series_skills       SkillTree (+ Pufferfish Skills)
// Shared libraries the groups depend on (ArmorModelAPI, Runes, StructurePoolAPI, BundleAPI) load with any group.
// CI and other developers never evaluate this file.
//
// 26.1+: the game is unobfuscated, the published platform jar is the shaded main artifact (no `dev-shadow`
// classifier any more) and goes straight on the runtime classpath. See LESSONS_1.21.11_TO_26.1 §1.
//
// After publishing a content mod to mavenLocal, bump its pin here (and in the other loader's copy).

def flags = rootProject.ext.rpgSeriesWorkspace

repositories {
    if (flags.rpg_series_skills) {
        maven { url = 'https://maven.puffish.net' } // Pufferfish Skills (SkillTree's hard dependency)
    }
    mavenLocal()
}

dependencies {
    // Shared libraries
    localRuntime("net.rpg_foundation:armor_model_api-fabric:1.1.0.001+26.3") { transitive = false }
    localRuntime("net.rpg_series:runes-fabric:1.3.2.001+26.3") { transitive = false }
    localRuntime("net.rpg_foundation:structure_pool_api-fabric:1.3.0.001+26.3") { transitive = false }
    // TODO 26.3: upstream BundleAPI has no 26.3 build; our fork from mavenLocal (back to maven.modrinth:bundle-api once released)
    localRuntime("com.github.TheRedBrain:bundle-api-fabric:3.0.0.001+26.3") { transitive = false }
    localRuntime("net.critical_strike:critical_strike-fabric:1.0.6.001+26.3") { transitive = false } // used by SkillTree/Jewelry configs (critical_strike:chance)

    if (flags.rpg_series_classes) {
    localRuntime("net.rpg_series:archers-fabric:3.1.2.001+26.3") { transitive = false }
    localRuntime("net.rpg_series:wizards-fabric:3.1.2.001+26.3") { transitive = false }
    localRuntime("net.rpg_series:paladins-fabric:3.1.2.001+26.3") { transitive = false }
    localRuntime("net.rpg_series:rogues-fabric:3.1.2.001+26.3") { transitive = false }
    }
    if (flags.rpg_series_gear) {
    localRuntime("net.arsenal:arsenal-fabric:1.5.1.001+26.3") { transitive = false }
    localRuntime("net.rpg_series:armory-fabric:1.5.2.001+26.3") { transitive = false }
    }
    if (flags.rpg_series_accessories) {
    localRuntime("net.rpg_series:jewelry-fabric:2.4.1.001+26.3") { transitive = false }
    localRuntime("net.rpg_series:relics-fabric:1.4.1.001+26.3") { transitive = false }
    }
    if (flags.rpg_series_structures) {
    localRuntime("net.rpg_series:gazebo-fabric:2.2.0.001+26.3") { transitive = false }
    localRuntime("net.rpg_series:village_taverns-fabric:1.3.0.001+26.3") { transitive = false }
    }
    if (flags.rpg_series_skills) {
    // TODO 26.3: not yet ported
    //localRuntime("net.rpg_series:skill_tree-fabric:1.6.1.007+26.2") { transitive = false }
        // TODO 26.3: re-pin to the 26.3 Pufferfish Skills build together with SkillTree
        //localRuntime("net.puffish:skillsmod:0.18.3+26.2:fabric")
    }
}
