// Dev-only ecosystem runtime for the SpellEngine workspace — applied by build.gradle ONLY when at least
// one group flag is enabled in the gitignored `workspace.properties` (template: workspace.properties.example):
//   rpg_series_classes      Archers, Wizards, Paladins, Rogues
//   rpg_series_gear         Arsenal, Armory
//   rpg_series_accessories  Jewelry, Relics
//   rpg_series_skills       SkillTree (+ Pufferfish Skills)
// Shared libraries the groups depend on (ArmorModelAPI, Runes, StructurePoolAPI, BundleAPI) load with any group.
// CI and other developers never evaluate this file.
//
// 26.1+: the game is unobfuscated, the published platform jar is the shaded main artifact (no `dev-shadow`
// classifier any more) and goes straight on the runtime classpath. See LESSONS_1.21.11_TO_26.1 §1.
//
// After publishing a content mod to mavenLocal, bump its pin here (and in the other loader's copy).

def flags = rootProject.ext.rpgSeriesWorkspace

repositories {
    if (flags.rpg_series_skills) {
        maven { url = 'https://maven.puffish.net' } // Pufferfish Skills (SkillTree's hard dependency)
    }
    mavenLocal()
}

dependencies {
    // Shared libraries
    localRuntime("net.rpg_foundation:armor_model_api-fabric:1.0.3.001+26.1.2") { transitive = false }
    localRuntime("net.rpg_series:runes-fabric:1.3.3.001+26.1.2") { transitive = false }
    localRuntime("net.rpg_foundation:structure_pool_api-fabric:1.3.1.001+26.1.2") { transitive = false }
    localRuntime("com.github.TheRedBrain:bundle-api-fabric:1.1.2.001+26.1.2") { transitive = false }
    // TODO 26.1: not yet published for 26.1.2 -- localRuntime("net.critical_strike:critical_strike-fabric:<x.y.z.NNN>+26.1.2") { transitive = false } // used by SkillTree/Jewelry configs (critical_strike:chance)

    if (flags.rpg_series_classes) {
    // TODO 26.1: not yet published for 26.1.2 -- localRuntime("net.rpg_series:archers-fabric:<x.y.z.NNN>+26.1.2") { transitive = false }
    // TODO 26.1: not yet published for 26.1.2 -- localRuntime("net.rpg_series:wizards-fabric:<x.y.z.NNN>+26.1.2") { transitive = false }
    // TODO 26.1: not yet published for 26.1.2 -- localRuntime("net.rpg_series:paladins-fabric:<x.y.z.NNN>+26.1.2") { transitive = false }
    // TODO 26.1: not yet published for 26.1.2 -- localRuntime("net.rpg_series:rogues-fabric:<x.y.z.NNN>+26.1.2") { transitive = false }
    }
    if (flags.rpg_series_gear) {
    // TODO 26.1: not yet published for 26.1.2 -- localRuntime("net.arsenal:arsenal-fabric:<x.y.z.NNN>+26.1.2") { transitive = false }
    // TODO 26.1: not yet published for 26.1.2 -- localRuntime("net.rpg_series:armory-fabric:<x.y.z.NNN>+26.1.2") { transitive = false }
    }
    if (flags.rpg_series_accessories) {
    // TODO 26.1: not yet published for 26.1.2 -- localRuntime("net.rpg_series:jewelry-fabric:<x.y.z.NNN>+26.1.2") { transitive = false }
    // TODO 26.1: not yet published for 26.1.2 -- localRuntime("net.rpg_series:relics-fabric:<x.y.z.NNN>+26.1.2") { transitive = false }
    }
    if (flags.rpg_series_skills) {
    // TODO 26.1: not yet published for 26.1.2 -- localRuntime("net.rpg_series:skill_tree-fabric:<x.y.z.NNN>+26.1.2") { transitive = false }
        // TODO 26.1: Pufferfish Skills has no 26.1 pin verified yet -- localRuntime("net.puffish:skillsmod:<ver>+26.1.2:fabric")
    }
}
